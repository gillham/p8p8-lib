# configuration file for the Atari 8-bit computers: the 800XL and the others with
# 48 KB or more (400/800 with 48 KB, XL, XE)
#
# The program is an Atari executable (.xex) for $2000, with the address DOS starts it
# at.  Run it without the BASIC cartridge (OPTION held down when an XL or XE starts),
# or build with -memtop $9c00 for a machine that has BASIC in.
# emulators: "atari800 -xl -nobasic -run hello.xex", "Altirra64.exe hello.xex"
#
# memory map:
# $0000-$007f = the OS's zero page
# $0080-$00ff = free (BASIC's, and from $d4 the floating point routines', when those are used)
# $0100-$01ff = stack
# $0200-$05ff = the OS's variables and buffers
# $0600-$06ff = free ("page 6"): the virtual registers are here
# $0700-$1fff = DOS, when there is one
# $2000-$bbff = the program
# $bc00-$bfff = the screen's display list and memory (below $a000 with BASIC in)
# $c000-$cfff = the OS (RAM on a 400/800)
# $d000-$d7ff = the hardware
# $d800-$ffff = the floating point routines and the OS

cpu = 6502
encoding = atascii
output_type = XEX
launcher = none
load_address = $2000
memtop = $bc00
bss_highram_start = 0
bss_highram_end = 0
bss_goldenram_start = 0
bss_goldenram_end = 0

# io_regions specifies memory-mapped I/O registers that should be treated differentely.
# it can be zero or more memory address ranges (inclusive) separated by comma
io_regions = $d000-$d7ff

# zeropage scratch variables. zp_scratch_reg must always be zp_scratch_b1+1 !
zp_scratch_b1 = $cb
zp_scratch_reg = $cc
zp_scratch_w1 = $cd
zp_scratch_w2 = $cf
zp_scratch_ptr = $d1

# free zeropage locations for the various zp usage methods
# zero or more zeropage address ranges (inclusive).
# The OS has $00-$7f, also in its interrupts, so no method gives those away.
# (The scratch variables above are left out by hand, for a compiler that does not.)
zp_fullsafe = $80-$ca,$d3-$ff
zp_kernalsafe = $80-$ca,$d3-$ff
zp_basicsafe = $80-$ca,$d3-$ff

# the start of the 32 bytes used by the R0-R15 virtual registers. Can be in Zeropage or elsewhere.
virtual_registers = $0600

# if a non-empty custom launcher code string is supplied, the compiler won't output ANY launcher / init code by itself,
# and instead outputs whatever is specified here. (You can use \n here for newline and \ for line continuantions)
custom_launcher_code =

# additional options passed to the assembler program
assembler_options =

# (p8p8) lines for the assembler after the program: one more part of the file, which
# puts the program's start in RUNAD, where DOS starts what it has loaded
asm_end = * = $02e0\n    .word prog8_program_start

# (p8p8) what -run runs
run_command = atari800 -xl -nobasic -run {file}
