# Target configuration for p8p8: the TRS-80 Model 4 in its own mode, with
# TRSDOS 6 or LS-DOS 6.
#
# A Z80 machine: "cpu = z80" selects p8p8's own Z80 code generator, which writes
# assembly for z88dk's z80asm.  The program is a command file (.cmd) that is run
# from the DOS prompt; trs80gp -m4 runs it on the host.  The screen is 80 by 24,
# and everything goes through the DOS's supervisor calls (rst $28 with the
# number in A).  docs/TARGETS.md describes the keys.

cpu = z80
encoding = iso

# where the DOS loads a program of the user's
load_address = $3000
output_extension = .cmd
# a command file: the program in load records, then where it starts
output_format = cmd

# The DOS starts a program with its stack in low memory, so the program has a
# stack of its own, of this many bytes.  (It is inside the program, below
# $f400: the DOS pages the keyboard and the screen in from there up while its
# routines run.)
stack_size = 1024

# the end: the supervisor call @EXIT (22), with the status in HL
exit_code = ld  hl,0\n\
    ld  a,22\n\
    rst  $28

# The console, as three routines that end by returning: a character (in A)
# out, a key or 0 without waiting (in A), and a character in that is waited
# for and shown.  The supervisor calls @DSP (2, the character in C), @KBD (8:
# zero flag and the key, or not zero for none) and @KEY (1).  A line ends
# with 10 in a Prog8 program and with 13 for the DOS, both ways.
console_out = cp  10\n\
    jr  nz,p8con_out\n\
    ld  a,13\n\
    p8con_out:\n\
    ld  c,a\n\
    ld  a,2\n\
    rst  $28\n\
    ret
key_poll = ld  a,8\n\
    rst  $28\n\
    ret  z\n\
    xor  a\n\
    ret
char_in = ld  a,1\n\
    rst  $28\n\
    push  af\n\
    ld  c,a\n\
    ld  a,2\n\
    rst  $28\n\
    pop  af\n\
    cp  13\n\
    ret  nz\n\
    ld  a,10\n\
    ret

# A program with floats is linked by z88dk's zcc, with its 32-bit maths
# library (--math32) and the C source that all Z80 machines share.  z88dk has
# no Model 4 platform: this is its TRS-80 one without the Model I and III DOS
# library, at $3000.  A program without floats is made by z88dk's assembler
# alone.
zcc_platform = +trs80 -subtype=disk -create-app -lndos -pragma-define:CRT_ORG_CODE=0x3000 -pragma-define:EG2000_ENABLED=0 -pragma-define:CLIB_KEYBOARD_ADDRESS=0x3800 -pragma-define:CRT_HEAP_AMALLOC=1
float_source = ../z80/z80-float.c
# Lines for the start of zcc's own first instructions (its section
# code_crt_init).  The stack goes to the top of the memory that is free for
# programs (the supervisor call @HIGH$, 100, gives it), but below $f400, where
# the DOS pages the keyboard and the screen in while its routines run: zcc's
# code lays out the heap for malloc below the stack, so the stack cannot be
# inside the program here.  (These lines are called, so the return address
# moves along.)  Then zcc's code is given an empty command line of the
# program's own in place of the one HL points to, which it would write into
# (see the trs80 target).
zcc_init = EXTERN  __head\n\
    ld  b,0\n\
    ld  hl,0\n\
    ld  a,100\n\
    rst  $28\n\
    ld  a,h\n\
    cp  $f4\n\
    jr  c,p8_stack_set\n\
    ld  hl,$f3ff\n\
    p8_stack_set:\n\
    inc  hl\n\
    pop  de\n\
    ld  sp,hl\n\
    push  de\n\
    ld  hl,(__head+1)\n\
    ld  e,(hl)\n\
    inc  hl\n\
    ld  d,(hl)\n\
    dec  hl\n\
    ld  (p8_entry_hl),de\n\
    ld  de,p8_no_line\n\
    ld  (hl),e\n\
    inc  hl\n\
    ld  (hl),d\n\
    jr  p8_line_set\n\
    p8_no_line:\n\
    defb  13\n\
    p8_line_set:

# The command line: the DOS starts a program with HL at what follows the
# program's name, up to a carriage return.  The first instructions keep that
# HL (in a program that zcc links, its own first instructions have it, and
# the lines of zcc_init take it from there), and this routine copies the
# line to a text of the program's own that ends with 0.  Anything but
# printable characters up to a carriage return within 80 is no command line:
# trs80gp starts a program that it loads itself with HL at something else.
command_line = ld  hl,(p8_entry_hl)\n\
    ld  de,p8_line\n\
    ld  b,80\n\
    p8line_next:\n\
    ld  a,(hl)\n\
    cp  13\n\
    jr  z,p8line_end\n\
    cp  ' '\n\
    jr  c,p8line_none\n\
    cp  127\n\
    jr  nc,p8line_none\n\
    ld  (de),a\n\
    inc  hl\n\
    inc  de\n\
    djnz  p8line_next\n\
    p8line_none:\n\
    ld  de,p8_line\n\
    p8line_end:\n\
    xor  a\n\
    ld  (de),a\n\
    ld  hl,p8_line\n\
    ret
startup_code = ld  (p8_entry_hl),hl

# what -run runs, with {file} for the program (TRS80GP names the emulator
# when it is not in the path)
run_command = "${TRS80GP:-trs80gp}" -m4 {file}

# A 60th of a second, for sys.wait, by counting (26 clock periods each time
# round): the Model 4 at 4 MHz.  sys.ticks() is 0.
wait_jiffy = ld  bc,2564\n\
    p8jiffy:\n\
    dec  bc\n\
    ld  a,b\n\
    or  c\n\
    jr  nz,p8jiffy\n\
    ret

# The modules: those of this directory first (textio), then those that the
# Z80 machines share.
library = ../z80
