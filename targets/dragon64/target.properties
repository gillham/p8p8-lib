# Target configuration for p8p8: the Dragon 64, in the mode it starts in (32 KB of
# BASIC's own, the Dragon 32's BASIC with its routines at the same places).  It is the
# dragon32 target; what -run starts is XRoar's Dragon 64.

base = ../dragon32/target.properties
run_command = xroar -machine dragon64 -run {file}
library = ../m6809
