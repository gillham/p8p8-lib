# Target configuration for p8p8: the Tandy Color Computer 3, with its Disk Extended
# Color BASIC: its 40 and 80 column screens, and the 32 column one that the Color
# Computer 2 has too, whichever BASIC's WIDTH has on.
#
# A 6809 machine: "cpu = 6809" selects p8p8's own 6809 code generator, which writes
# assembly for lwasm (lwtools).  The program is a DECB machine language file:
# LOADM"NAME" and EXEC run it, and it returns to BASIC when it ends.  It loads at
# $0e00, where Disk BASIC's graphics pages and then its program text are: a BASIC
# program in memory is gone after it.  The program and its variables have the
# memory from there to BASIC's stack near the top of RAM ($7fff with 32 KB or more).
# docs/TARGETS.md describes the keys.

cpu = 6809
encoding = iso
load_address = $0e00
output_extension = .bin
output_format = decb
# (no BASIC line before the program: %address and -address may move it)
launcher = none
# where the program and its variables must have ended: the assembler stops when they
# have not.  (BASIC's stack is just below its strings at the top of the lower 32 KB,
# near $7f30 when a program starts; this leaves it some 300 bytes.)
memory_end = $7e00

# How the program ends: it returns to BASIC, which called it.  (The first
# instructions keep the stack pointer, so that this works from anywhere.)
exit_code = rts

# what -run runs, with {file} for the program: XRoar loads it and starts it
run_command = xroar -machine coco3 -run {file}

# The console, as three routines that end by returning: a character (in A) out, a
# key or 0 without waiting (in A), and a character in that is waited for.
#
# A character goes straight into the screen's memory, whichever screen is on
# (BASIC's WIDTH, kept at $e7).  The 40 and 80 column screens are cells of two
# bytes, the character and its attribute, in memory block $36; BASIC keeps the
# cursor's address there at $fe00 as it has the block at $2000, the column and the
# line at $fe02, the columns and the lines at $fe04, the end at $fe06 and the
# attribute at $fe08.  Here the block is put at $e000 for as long as it is written
# to (where BASIC's own code is, which is not called meanwhile; interrupts are off),
# so the program can be anywhere below that.  The mark that BASIC leaves at the
# cursor (an underline) is taken away; 10 and 13 start a new line, 8 takes the last
# character away, 12 clears the screen, and at the end the screen moves up a line.
# With WIDTH 32 it is the 32 column screen, as on the Color Computer 2.
console_out = tst  $e7\n\
    lbeq  p8con_vdg\n\
    pshs  cc,b,x,y,u\n\
    orcc  #$50\n\
    ldb  #$36\n\
    stb  $ffa7\n\
    ldx  $fe00\n\
    leax  $c000,x\n\
    ldb  1,x\n\
    andb  #$bf\n\
    stb  1,x\n\
    cmpa  #13\n\
    beq  p8hr_line\n\
    cmpa  #10\n\
    beq  p8hr_line\n\
    cmpa  #8\n\
    lbeq  p8hr_back\n\
    cmpa  #12\n\
    lbeq  p8hr_clear\n\
    cmpa  #32\n\
    lblo  p8hr_done\n\
    ldb  $fe08\n\
    std  ,x++\n\
    inc  $fe02\n\
    ldb  $fe02\n\
    cmpb  $fe04\n\
    lblo  p8hr_done\n\
    clr  $fe02\n\
    inc  $fe03\n\
    bra  p8hr_bottom\n\
    p8hr_line:\n\
    ldb  $fe04\n\
    subb  $fe02\n\
    lslb\n\
    clra\n\
    leax  d,x\n\
    clr  $fe02\n\
    inc  $fe03\n\
    p8hr_bottom:\n\
    ldb  $fe03\n\
    cmpb  $fe05\n\
    blo  p8hr_done\n\
    dec  $fe03\n\
    ldx  #$e000\n\
    clra\n\
    ldb  $fe04\n\
    lslb\n\
    leau  d,x\n\
    ldy  $fe06\n\
    leay  $c000,y\n\
    pshs  y\n\
    p8hr_move:\n\
    ldd  ,u++\n\
    std  ,x++\n\
    cmpu  ,s\n\
    blo  p8hr_move\n\
    pshs  x\n\
    lda  #32\n\
    ldb  $fe08\n\
    p8hr_blank:\n\
    std  ,x++\n\
    cmpx  2,s\n\
    blo  p8hr_blank\n\
    puls  x\n\
    leas  2,s\n\
    bra  p8hr_done\n\
    p8hr_back:\n\
    tst  $fe02\n\
    beq  p8hr_done\n\
    dec  $fe02\n\
    lda  #32\n\
    ldb  $fe08\n\
    std  ,--x\n\
    bra  p8hr_done\n\
    p8hr_clear:\n\
    ldx  #$e000\n\
    ldy  $fe06\n\
    leay  $c000,y\n\
    pshs  y\n\
    lda  #32\n\
    ldb  $fe08\n\
    p8hr_wipe:\n\
    std  ,x++\n\
    cmpx  ,s\n\
    blo  p8hr_wipe\n\
    leas  2,s\n\
    ldx  #$e000\n\
    clr  $fe02\n\
    clr  $fe03\n\
    p8hr_done:\n\
    leax  $4000,x\n\
    stx  $fe00\n\
    ldb  #$3f\n\
    stb  $ffa7\n\
    puls  cc,b,x,y,u,pc\n\
    p8con_vdg:\n\
    pshs  b,x\n\
    ldx  $88\n\
    cmpa  #10\n\
    beq  p8con_line\n\
    cmpa  #13\n\
    beq  p8con_line\n\
    cmpa  #8\n\
    beq  p8con_back\n\
    cmpa  #12\n\
    beq  p8con_clear\n\
    cmpa  #32\n\
    blo  p8con_keep\n\
    tsta\n\
    bmi  p8con_put\n\
    cmpa  #64\n\
    bhs  p8con_letter\n\
    adda  #64\n\
    bra  p8con_put\n\
    p8con_letter:\n\
    cmpa  #96\n\
    blo  p8con_put\n\
    suba  #96\n\
    p8con_put:\n\
    sta  ,x+\n\
    p8con_end:\n\
    cmpx  #$0600\n\
    blo  p8con_keep\n\
    ldx  #$0400\n\
    p8con_scroll:\n\
    ldd  32,x\n\
    std  ,x++\n\
    cmpx  #$05e0\n\
    blo  p8con_scroll\n\
    ldd  #$6060\n\
    p8con_blank:\n\
    std  ,x++\n\
    cmpx  #$0600\n\
    blo  p8con_blank\n\
    ldx  #$05e0\n\
    p8con_keep:\n\
    stx  $88\n\
    puls  b,x,pc\n\
    p8con_line:\n\
    tfr  x,d\n\
    andb  #$e0\n\
    addd  #32\n\
    tfr  d,x\n\
    bra  p8con_end\n\
    p8con_back:\n\
    cmpx  #$0400\n\
    bls  p8con_keep\n\
    lda  #$60\n\
    sta  ,-x\n\
    bra  p8con_keep\n\
    p8con_clear:\n\
    ldx  #$0400\n\
    ldd  #$6060\n\
    p8con_wipe:\n\
    std  ,x++\n\
    cmpx  #$0600\n\
    blo  p8con_wipe\n\
    ldx  #$0400\n\
    bra  p8con_keep

# The keys are the ROM's: POLCAT, through its vector at $a000, gives a key in A or
# 0 (it keeps B and X).
key_poll = jsr  [$a000]\n\
    rts
char_in = jsr  [$a000]\n\
    beq  p8rt_chrin\n\
    rts

# A 60th of a second, for sys.wait: until Extended BASIC's clock ($0112, which its
# interrupt routine counts up 60 times a second) has changed.  With interrupts
# off it never would, so then there is no wait.  sys.ticks() is that clock, read
# until two reads agree (the interrupt can come between its two bytes).
wait_jiffy = tfr  cc,a\n\
    bita  #$10\n\
    bne  p8jiffy_end\n\
    ldx  $0112\n\
    p8jiffy_wait:\n\
    sync\n\
    cmpx  $0112\n\
    beq  p8jiffy_wait\n\
    p8jiffy_end:\n\
    rts
ticks = ldd  $0112\n\
    cmpd  $0112\n\
    bne  p8rt_ticks\n\
    rts

# Floats are those of the BASIC in the ROM: five bytes, and its routines.  Where
# they are in Color BASIC 1.2 and 1.3 and in Extended Color BASIC 1.1 (and in the
# Color Computer 3's ROM, which has the same code there): the accumulator and what
# takes it from and to memory at X, the arithmetic with the number at X (which is
# the left one), the compare, a word and a long made a float, a float made a
# long, and the functions.
float_accumulator = $4f
float_load = $bc14
float_store = $bc35
float_add = $b9c2
float_sub = $b9b9
float_mul = $baca
float_div = $bb8f
float_compare = $bc96
float_from_word = $b4f4
float_normalize = $ba18
float_to_long = $bcc8
float_floor = $bcee
float_half = $b9b4
float_unpack = $bb2f
float_power = $8489
float_sqrt = $8480
float_sin = $bf78
float_cos = $8378
float_tan = $8381
float_atan = $83b0
float_ln = $8446

# The modules: those of this directory first (textio), then those that the 6809
# machines share.
library = ../m6809
