# Target configuration for p8p8: the Tandy Color Computer 3, in the 32 column
# text mode that the Color Computer 2 has too (its 40 and 80 column screens are not
# used yet), with its Disk Extended Color BASIC.
#
# A 6809 machine: "cpu = 6809" selects p8p8's own 6809 code generator, which writes
# assembly for lwasm (lwtools).  The program is a DECB machine language file:
# LOADM"NAME" and EXEC run it, and it returns to BASIC when it ends.  It loads at
# $0e00, where Disk BASIC's graphics pages and then its program text are: a BASIC
# program in memory is gone after it.  The program and its variables have the
# memory from there to BASIC's stack near the top of RAM ($7fff with 32 KB or more).
# docs/TARGETS.md describes the keys.

cpu = 6809
encoding = iso
load_address = $0e00
output_extension = .bin
output_format = decb

# How the program ends: it returns to BASIC, which called it.  (The first
# instructions keep the stack pointer, so that this works from anywhere.)
exit_code = rts

# what -run runs, with {file} for the program: XRoar loads it and starts it
run_command = xroar -machine coco3 -run {file}

# The console, as three routines that end by returning: a character (in A) out, a
# key or 0 without waiting (in A), and a character in that is waited for.
#
# A character goes straight into the screen's memory at the address that BASIC
# keeps as its cursor's ($88), in the screen's own codes (32-63 are 96-127 there,
# small letters 0-31, which show as inverse capitals).  10 and 13 start a new
# line, 8 takes the last character away, 12 clears the screen; at the end of the
# screen it moves up a line.
console_out = pshs  b,x\n\
    ldx  $88\n\
    cmpa  #10\n\
    beq  p8con_line\n\
    cmpa  #13\n\
    beq  p8con_line\n\
    cmpa  #8\n\
    beq  p8con_back\n\
    cmpa  #12\n\
    beq  p8con_clear\n\
    cmpa  #32\n\
    blo  p8con_keep\n\
    tsta\n\
    bmi  p8con_put\n\
    cmpa  #64\n\
    bhs  p8con_letter\n\
    adda  #64\n\
    bra  p8con_put\n\
    p8con_letter:\n\
    cmpa  #96\n\
    blo  p8con_put\n\
    suba  #96\n\
    p8con_put:\n\
    sta  ,x+\n\
    p8con_end:\n\
    cmpx  #$0600\n\
    blo  p8con_keep\n\
    ldx  #$0400\n\
    p8con_scroll:\n\
    ldd  32,x\n\
    std  ,x++\n\
    cmpx  #$05e0\n\
    blo  p8con_scroll\n\
    ldd  #$6060\n\
    p8con_blank:\n\
    std  ,x++\n\
    cmpx  #$0600\n\
    blo  p8con_blank\n\
    ldx  #$05e0\n\
    p8con_keep:\n\
    stx  $88\n\
    puls  b,x,pc\n\
    p8con_line:\n\
    tfr  x,d\n\
    andb  #$e0\n\
    addd  #32\n\
    tfr  d,x\n\
    bra  p8con_end\n\
    p8con_back:\n\
    cmpx  #$0400\n\
    bls  p8con_keep\n\
    lda  #$60\n\
    sta  ,-x\n\
    bra  p8con_keep\n\
    p8con_clear:\n\
    ldx  #$0400\n\
    ldd  #$6060\n\
    p8con_wipe:\n\
    std  ,x++\n\
    cmpx  #$0600\n\
    blo  p8con_wipe\n\
    ldx  #$0400\n\
    bra  p8con_keep

# The keys are the ROM's: POLCAT, through its vector at $a000, gives a key in A or
# 0 (it keeps B and X).
key_poll = jsr  [$a000]\n\
    rts
char_in = jsr  [$a000]\n\
    beq  p8rt_chrin\n\
    rts

# A 60th of a second, for sys.wait: until Extended BASIC's clock ($0112, which its
# interrupt routine counts up 60 times a second) has changed.  With interrupts
# off it never would, so then there is no wait.  sys.ticks() is that clock, read
# until two reads agree (the interrupt can come between its two bytes).
wait_jiffy = tfr  cc,a\n\
    bita  #$10\n\
    bne  p8jiffy_end\n\
    ldx  $0112\n\
    p8jiffy_wait:\n\
    sync\n\
    cmpx  $0112\n\
    beq  p8jiffy_wait\n\
    p8jiffy_end:\n\
    rts
ticks = ldd  $0112\n\
    cmpd  $0112\n\
    bne  p8rt_ticks\n\
    rts

# The modules: those of this directory first (textio), then those that the 6809
# machines share.
library = ../m6809
