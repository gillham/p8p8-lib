# Target configuration for p8p8: a bare 6809 as usim09batch simulates it.
#
# A 6809 machine: "cpu = 6809" selects p8p8's own 6809 code generator, which writes
# assembly for lwasm (lwtools).  The program is an Intel hex file, loaded at $0100,
# with the reset vector at its end; usim09batch runs it, prints what it writes to
# the serial port and ends with the program's status.  This is the machine of the
# tests; docs/TARGETS.md describes the keys.

cpu = 6809
encoding = iso
load_address = $0100
output_extension = .hex
output_format = ihex

# the first instructions (the stack below the simulator's devices at $ffc0), and how
# the program ends: when the serial port has sent its last byte, the status (in B)
# to the simulator's halt device
startup_code = lds  #$ff00
exit_code = lda  #2\n\
    p8sim_drain:\n\
    bita  $ffc4\n\
    beq  p8sim_drain\n\
    stb  $ffcc\n\
    p8sim_halt:\n\
    bra  p8sim_halt

# after everything else: the reset vector
tail_code = org  $fffe\n\
    fdb  p8_start

# what -run runs, with {file} for the program (the timeout counts instructions)
run_command = usim09batch --timeout=2000000000 {file}

# The console, as three routines that end by returning: a character (in A) out, a
# key or 0 without waiting (in A), and a character in that is waited for.  The
# simulator has a serial port (an MC6850) at $ffc4: bit 1 of its status says that
# a byte can be sent, bit 0 that one has come.
console_out = pshs  a\n\
    p8sim_out:\n\
    lda  $ffc4\n\
    bita  #2\n\
    beq  p8sim_out\n\
    puls  a\n\
    sta  $ffc5\n\
    rts
key_poll = lda  $ffc4\n\
    anda  #1\n\
    beq  p8sim_nokey\n\
    lda  $ffc5\n\
    p8sim_nokey:\n\
    rts
char_in = lda  $ffc4\n\
    bita  #1\n\
    beq  p8rt_chrin\n\
    lda  $ffc5\n\
    rts

# The modules: those of this directory first (textio), then those that the 6809
# machines share.
library = ../m6809
