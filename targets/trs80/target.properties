# Target configuration for p8p8: the TRS-80 Model I and Model III, with a DOS
# (TRSDOS, LDOS, NEWDOS/80...).
#
# A Z80 machine: "cpu = z80" selects p8p8's own Z80 code generator, which writes
# assembly for z88dk's z80asm.  The program is a command file (.cmd) that is run
# from the DOS prompt; trs80gp runs it on the host.  The screen is the 64 by 16
# one at $3c00, and the console and the keys are the ROM's, which the two models
# share.  docs/TARGETS.md describes the keys.

cpu = z80
encoding = iso

# above the DOS, which has the memory up to $51ff
load_address = $5200
output_extension = .cmd
# a command file: the program in load records, then where it starts
output_format = cmd

# The program is called by the DOS, on the DOS's stack, which is small: a
# program with floats overran it and left the DOS damaged.  So the program
# has a stack of its own, of this many bytes.
stack_size = 1024

# (The only other first instruction keeps the command line: see command_line.)  It ends with a jump to the DOS's "ready" entry.
exit_code = jp  $402d

# The console, as three routines that end by returning: a character (in A)
# out, a key or 0 without waiting (in A), and a character in that is waited
# for and shown.
#
# Output goes straight into the screen's memory (64 by 16 at $3c00), at the
# place that the ROM keeps as its cursor ($4020), so letters are shown as they
# are: the Model I's ROM routine would make capitals of them.  No cursor is
# shown.  10 and 13 start a new line, 8 goes back one and clears it, 28 is the
# top left, 31 clears from here to the end, 12 clears everything; at the end
# the screen moves up a line.  After trs80.capitals(true) small letters are
# shown as capitals, for a Model I without the lower case kit.
console_out = ld  c,a\n\
    ld  hl,($4020)\n\
    cp  10\n\
    jr  z,p8con_line\n\
    cp  13\n\
    jr  z,p8con_line\n\
    cp  8\n\
    jr  z,p8con_back\n\
    cp  28\n\
    jr  z,p8con_home\n\
    cp  31\n\
    jr  z,p8con_clear\n\
    cp  12\n\
    jr  z,p8con_all\n\
    cp  14\n\
    ret  z\n\
    cp  15\n\
    ret  z\n\
    ld  a,(p8con_capitals)\n\
    or  a\n\
    ld  a,c\n\
    jr  z,p8con_put\n\
    cp  'a'\n\
    jr  c,p8con_put\n\
    cp  'z'+1\n\
    jr  nc,p8con_put\n\
    sub  32\n\
    p8con_put:\n\
    ld  (hl),a\n\
    inc  hl\n\
    p8con_end:\n\
    ld  a,h\n\
    cp  $40\n\
    jr  nz,p8con_keep\n\
    ld  hl,$3c40\n\
    ld  de,$3c00\n\
    ld  bc,960\n\
    ldir\n\
    ld  h,d\n\
    ld  l,e\n\
    push  hl\n\
    ld  b,64\n\
    p8con_blank:\n\
    ld  (hl),' '\n\
    inc  hl\n\
    djnz  p8con_blank\n\
    pop  hl\n\
    p8con_keep:\n\
    ld  ($4020),hl\n\
    ret\n\
    p8con_line:\n\
    ld  a,l\n\
    and  $c0\n\
    add  a,64\n\
    ld  l,a\n\
    jr  nc,p8con_end\n\
    inc  h\n\
    jr  p8con_end\n\
    p8con_back:\n\
    ld  a,l\n\
    and  63\n\
    ret  z\n\
    dec  hl\n\
    ld  (hl),' '\n\
    jr  p8con_keep\n\
    p8con_all:\n\
    ld  hl,$3c00\n\
    p8con_clear:\n\
    push  hl\n\
    p8con_wipe:\n\
    ld  (hl),' '\n\
    inc  hl\n\
    ld  a,h\n\
    cp  $40\n\
    jr  nz,p8con_wipe\n\
    pop  hl\n\
    jr  p8con_keep\n\
    p8con_home:\n\
    ld  hl,$3c00\n\
    jr  p8con_keep

# The keys are the ROM's scan ($002b: a key or 0).  Letters come small
# unshifted and as capitals shifted on both models: the Model I's ROM gives
# them the other way round, so there they are swapped, and the Model III's
# caps lock ($4019) is off during the scan.  trs80.caps_lock(true) swaps them
# again.
key_poll = ld  a,($0054)\n\
    dec  a\n\
    ld  a,(p8con_caps_lock)\n\
    jr  nz,p8key_three\n\
    xor  1\n\
    push  af\n\
    call  $002b\n\
    jr  p8key_case\n\
    p8key_three:\n\
    push  af\n\
    ld  hl,$4019\n\
    ld  b,(hl)\n\
    ld  (hl),0\n\
    push  hl\n\
    push  bc\n\
    call  $002b\n\
    pop  bc\n\
    pop  hl\n\
    ld  (hl),b\n\
    p8key_case:\n\
    pop  bc\n\
    ld  c,a\n\
    and  $df\n\
    cp  'A'\n\
    jr  c,p8key_keep\n\
    cp  'Z'+1\n\
    jr  nc,p8key_keep\n\
    bit  0,b\n\
    jr  z,p8key_keep\n\
    ld  a,c\n\
    xor  $20\n\
    ret\n\
    p8key_keep:\n\
    ld  a,c\n\
    ret
# a character in: a key that is waited for, shown, and 10 for ENTER
char_in = call  p8rt_getkey\n\
    or  a\n\
    jr  z,p8rt_chrin\n\
    push  af\n\
    call  p8rt_chrout\n\
    pop  af\n\
    cp  13\n\
    ret  nz\n\
    ld  a,10\n\
    ret

# places that those routines and the trs80 module share: whether small letters
# are shown as capitals, and whether the letters typed are swapped
machine_cells = p8con_capitals:\n\
    defb  0\n\
    p8con_caps_lock:\n\
    defb  0

# A program with floats is linked by z88dk's zcc for this platform, with its
# 32-bit maths library (--math32) and the C source that all Z80 machines
# share.  A program without floats is made by z88dk's assembler alone.
zcc_platform = +trs80 -subtype=cmd -create-app -pragma-define:CRT_HEAP_AMALLOC=1 -pragma-define:CRT_HEAP_ENABLE=1
float_source = ../z80/z80-float.c
# Lines for the start of zcc's own first instructions (its section
# code_crt_init).  Those take a command line where HL points when the program
# starts, and put a 0 at its end.  trs80gp starts a program with HL at a byte
# of the DOS's own, which that 0 then breaks (the DOS takes no ENTER any
# more).  A Prog8 program has no command line here yet, so zcc's code is given
# an empty one of the program's own: the address is the operand of its first
# instruction (at __head).
# Before that the stack is moved to the program's own: TRSDOS 1.3 on the
# Model III starts a program with its stack in the system's memory at $4089,
# which zcc's code would overwrite (these lines are called, so the return
# address moves along).
zcc_init = EXTERN  __head\n\
    pop  de\n\
    ld  sp,p8_stack_top\n\
    push  de\n\
    ld  hl,(__head+1)\n\
    ld  e,(hl)\n\
    inc  hl\n\
    ld  d,(hl)\n\
    dec  hl\n\
    ld  (p8_entry_hl),de\n\
    ld  de,p8_no_line\n\
    ld  (hl),e\n\
    inc  hl\n\
    ld  (hl),d\n\
    jr  p8_line_set\n\
    p8_no_line:\n\
    defb  13\n\
    p8_line_set:\n\
    ld  a,15\n\
    call  $0033

# The command line: the DOS starts a program with HL at what follows the
# program's name, up to a carriage return.  The first instructions keep that
# HL (in a program that zcc links, its own first instructions have it, and
# the lines of zcc_init take it from there), and this routine copies the
# line to a text of the program's own that ends with 0.  Anything but
# printable characters up to a carriage return within 80 is no command line:
# trs80gp starts a program that it loads itself with HL at something else.
command_line = ld  hl,(p8_entry_hl)\n\
    ld  de,p8_line\n\
    ld  b,80\n\
    p8line_next:\n\
    ld  a,(hl)\n\
    cp  13\n\
    jr  z,p8line_end\n\
    cp  ' '\n\
    jr  c,p8line_none\n\
    cp  127\n\
    jr  nc,p8line_none\n\
    ld  (de),a\n\
    inc  hl\n\
    inc  de\n\
    djnz  p8line_next\n\
    p8line_none:\n\
    ld  de,p8_line\n\
    p8line_end:\n\
    xor  a\n\
    ld  (de),a\n\
    ld  hl,p8_line\n\
    ret
startup_code = ld  (p8_entry_hl),hl\n\
    ld  a,15\n\
    call  $0033

# what -run runs, with {file} for the program (TRS80GP names the emulator
# when it is not in the path; -m1 is the Model I, -m3 the Model III)
run_command = "${TRS80GP:-trs80gp}" -m1 {file}

# A 60th of a second, for sys.wait, by counting (26 clock periods each time
# round): the Model I at 1.77 MHz and the Model III at 2.03 MHz: between the two.  sys.ticks() is 0.
wait_jiffy = ld  bc,1200\n\
    p8jiffy:\n\
    dec  bc\n\
    ld  a,b\n\
    or  c\n\
    jr  nz,p8jiffy\n\
    ret

# The modules: those of this directory first (textio), then those that the
# Z80 machines share.
library = ../z80
