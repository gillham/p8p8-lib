# Target configuration for p8p8: CP/M 2.2 and later on the Z80.
#
# A Z80 machine: "cpu = z80" selects p8p8's own Z80 code generator, which writes
# assembly for z88dk's z80asm.  The program is a .com file, loaded at $0100;
# tnylpo or RunCPM run it on the host.  docs/TARGETS.md describes the keys.

cpu = z80
encoding = iso
load_address = $0100
output_extension = .com

# the first instructions (the stack goes below the BDOS, whose address is at 6),
# and how the program ends (a jump to 0 is a warm start: back to the prompt)
startup_code = ld  sp,($0006)
exit_code = jp  0

# A program with floats is linked by z88dk's zcc for this platform, with its
# 32-bit maths library (--math32) and this C source, which all Z80 machines
# share: the digits of a float, reading one, and rounding to even, which the
# library lacks or gets wrong.  A program without floats is made by z88dk's
# assembler alone and stays small.
zcc_platform = +cpm
float_source = ../z80/z80-float.c

# what -run runs, with {file} for the program (tnylpo wants a name of 8 and 3 characters)
run_command = tnylpo {file}

# The console, as three routines that end by returning: a character (in A)
# out, a key or 0 without waiting (in A), and a character in that is waited
# for and shown.  On CP/M they are BDOS functions 2, 6 and 1.
console_out = ld  e,a\n\
    ld  c,2\n\
    jp  5
key_poll = ld  e,255\n\
    ld  c,6\n\
    jp  5
char_in = ld  c,1\n\
    jp  5

# The modules: those of this directory first (textio), then those of the
# llvm16 target.  Modules written for the Z80 will take their place here,
# one at a time.
library = ../llvm16
