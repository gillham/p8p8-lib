# configuration file for the Apple II: the II Plus, IIe, IIc and IIgs
#
# The program is a binary file for $2000, with DOS 3.3's four bytes (its address and
# length) before it: BRUN starts it.  For ProDOS the file is the same without those
# four bytes, type BIN with $2000 as its address.
#
# memory map:
# $0000-$00ff = zero page (the monitor's $20-$4f; Applesoft's and DOS's most of the rest)
# $0100-$01ff = stack
# $0200-$02ff = the line that is typed
# $0300-$03cf = free: the virtual registers are here
# $03d0-$03ff = DOS's and the monitor's vectors
# $0400-$07ff = the text screen
# $0800-$1fff = Applesoft's program
# $2000-$95ff = the program ($2000-$3fff is also high resolution page 1, $4000-$5fff page 2)
# $9600-$bfff = DOS 3.3, or ProDOS's BASIC.SYSTEM from $9a00
# $c000-$cfff = the hardware and the cards
# $d000-$ffff = Applesoft and the monitor
#
# cpu = 65C02 is the enhanced IIe, the IIc and the IIgs; build with -cpu 6502 for a
# II Plus or an unenhanced IIe.
cpu = 65C02
encoding = iso
output_type = RAW
load_address = $2000
memtop = $9600
bss_highram_start = 0
bss_highram_end = 0
bss_goldenram_start = 0
bss_goldenram_end = 0
launcher = none

# io_regions specifies memory-mapped I/O registers that should be treated differently.
# it can be zero or more memory address ranges (inclusive) separated by comma
io_regions = $c000-$cfff

# zeropage scratch variables. zp_scratch_reg must always be zp_scratch_b1+1 !
# All of them are bytes that the monitor, DOS and Applesoft leave alone.
zp_scratch_ptr = $06
zp_scratch_b1 = $08
zp_scratch_reg = $09
zp_scratch_w1 = $eb
zp_scratch_w2 = $ed

# free zeropage locations for the various zp usage methods
# zero or more zeropage address ranges (inclusive).
# basicsafe: what is left of the bytes nothing uses; such a program can return to BASIC.
# kernalsafe and fullsafe: Applesoft's bytes too, the monitor's are kept; BASIC is
# not in a state to go on after such a program.
zp_fullsafe = $0a-$0c,$50-$ff
zp_kernalsafe = $0a-$0c,$50-$ff
zp_basicsafe = $ce-$cf,$d7,$e3,$ef,$fa-$fd

# the start of the 32 bytes used by the R0-R15 virtual registers. Can be in Zeropage or elsewhere.
virtual_registers = $0300

# if a non-empty custom launcher code string is supplied, the compiler won't output ANY launcher / init code by itself,
# and instead outputs whatever is specified here. (You can use \n here for newline and \ for line continuantions)
custom_launcher_code =

# additional options passed to the assembler program: the four bytes of DOS 3.3 before the
# program; and p8_prodos, which the library's exit code looks at (see the prodos target)
assembler_options = --apple-ii -D p8_prodos=0

# what -run runs (p8p8): bobbin, with the program put where its four bytes say and started
run_command = bobbin --delay-until INPUT --load {file} --load-at 1ffc --jump-to 2000
