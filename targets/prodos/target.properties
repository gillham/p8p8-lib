# configuration file for the Apple II with ProDOS: a system program
#
# The machine is the appleii target's (its library is that one's: the screen, the
# keys); what differs is how the program is started and ended, and its diskio, which
# is ProDOS's (the MLI).
#
# The program is a file for $2000 with nothing before it: on the disk it is a file of
# type SYS (with a name that ends in .SYSTEM, as is usual), which ProDOS loads at
# $2000 and jumps to; from BASIC.SYSTEM a line with "-" and its name starts it.
# It ends with ProDOS's QUIT, not with a return: nothing called it.
#
# memory map: as the appleii target's, with
# $2000-$beff = the program (BASIC.SYSTEM is not there when a system program runs)
# $bf00-$bfff = ProDOS's global page: the MLI's entry, the system bit map
base = ../appleii/target.properties
library = ../appleii
memtop = $bf00

# (the symbol that the library's exit code looks at; and no four bytes of DOS 3.3)
assembler_options = -D p8_prodos=1

# nothing that -run could start: the program needs ProDOS in memory
run_command =
