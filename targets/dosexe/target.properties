# Target configuration for p8p8: MS-DOS on an 8086 or 8088, as an .EXE program.
#
# The dos target with another file: the program's code has a segment of its own, and
# its variables, strings and stack another (64 KB each), where a .COM program has one
# for everything.  The code generator writes the file's header itself, so no linker
# is needed.  CS is the code's segment; DS, ES and SS are the data's.
#
# Assembly in a program (%asm) must keep its data out of the code: bytes written
# there with "db" are not where DS points.

base = ../dos/target.properties

output_extension = .exe
output_format = exe
# where the variables must have ended in their segment (the stack comes down from
# its end; this leaves it 4 KB)
memory_end = $f000

# The first instructions.  DOS starts the program with SS at its data and DS and ES
# at the segment it made for the program, where the command line is and the number
# of the environment's segment: those are copied into the data.  Then the dos
# target's questions about the output and the input.
startup_code = mov  ax, ss\n\
    mov  es, ax\n\
    mov  si, 0x80\n\
    mov  di, p8dos_tail\n\
    mov  cx, 0x80\n\
    cld\n\
    rep movsb\n\
    mov  bx, [0x2c]\n\
    mov  ds, ax\n\
    mov  [p8dos_env], bx\n\
    mov  ax, 0x4400\n\
    mov  bx, 1\n\
    int  0x21\n\
    and  dl, 0x82\n\
    cmp  dl, 0x82\n\
    jne  p8dos_file_out\n\
    inc  byte [p8dos_screen]\n\
    p8dos_file_out:\n\
    mov  ax, 0x4400\n\
    xor  bx, bx\n\
    int  0x21\n\
    and  dl, 0x81\n\
    cmp  dl, 0x81\n\
    jne  p8dos_file_in\n\
    inc  byte [p8dos_keyboard]\n\
    p8dos_file_in:

machine_cells = p8dos_screen:  db  0\n\
    p8dos_keyboard:  db  0\n\
    p8dos_attr:  db  7\n\
    p8dos_env:  dw  0\n\
    p8dos_tail:  times  128  db  0

run_command = dosbox-x -fastlaunch {file}

library = ../i8086
