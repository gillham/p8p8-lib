# configuration file for the GameTank  W65C02S based virtual console target
#
# details: https://gametank.zone/manual/
#
# memory map:
# $0000-$00ff = zero page
# $0100-$01ff = stack
# $0200-$03ff = virtual text screen
# $0400-$05ff = virtual color memory
# $0600-$1fff = 6656 bytes general purpose ram ("golden ram" below)
# $2000-$2009 = I/O registers
# $2800-$280f = VIA registers
# $3000-$3fff = audio ram
# $4000-$7fff = framebuffer / sprite ram / blitter registers
# $8000-$bfff = cartridge rom 16KB banked portion (on 2MB cartridges)
# $c000-$ffff = cartridge rom fixed bank 255 (includes 6502 vectors)
#
cpu = 65C02
output_type = RAW
launcher = none
encoding = iso
#load_address = $c000
load_address = $c000
memtop = $fffa
# "varshigh" reserved for banked cartridge code
bss_highram_start = $1e00
bss_highram_end = $2000
bss_goldenram_start = $600
bss_goldenram_end = $1e00
#bss_goldenram_end = $2000
supports_banked_calls = true

# io_regions specifies memory-mapped I/O registers that should be treated differently.
# it can be zero or more memory address ranges (inclusive) separated by comma
io_regions = $2000-$2009,$2800-$280f

# zeropage scratch variables. zp_scratch_reg must always be zp_scratch_b1+1 !
zp_scratch_ptr = $f8
zp_scratch_b1 = $fa
zp_scratch_reg = $fb
zp_scratch_w1 = $fc
zp_scratch_w2 = $fe

# vblank irq based jiffy clock uses $ed,$ee,$ef
# chrout_fb uses $f0-$f7
# what is $20-$27?
# free zeropage locations for the various zp usage methods
# zero or more zeropage address ranges (inclusive).
zp_fullsafe = $28-$ec
zp_kernalsafe = $28-$ec
zp_basicsafe = $28-$ec

# The start of the 32 bytes used by the R0-R15 virtual registers.
# Can be in zero page or elsewhere.
virtual_registers = $0008

# replace stock startup code
custom_launcher_code = .include "startup.asm"

# Where can we find the standard library (syslib.p8).
# You can still add more paths manually using -srcdirs

# additional options passed to the assembler program
assembler_options =

# Overlays (p8p8): blocks with %overlay n have their code (and what they include with
# %asmbinary or assembly) in bank n of the cartridge, 128 to 254, which is in the window
# at $8000-$bfff while that code runs and only then: the bank the main program chose
# (for its assets, say) is kept meanwhile, as on the Commander X16 (overlay_bank.asm).
# The main program is in the fixed bank, 255.  In the texts %t is a subroutine and %n a
# bank; those marked fast are for ordinary subroutines, where only A has to be kept, the
# others keep the flags too.  p8c writes the whole cartridge: image_size bytes,
# bank overlay_image_first at its start and the main program at its end.
overlay_window_start = $8000
overlay_window_end = $c000
overlay_max = 254
overlay_thunk = jsr  p8_overlay_inp_%n\njsr  %t\njmp  p8_overlay_out_p
overlay_thunk_fast = jsr  p8_overlay_in_%n\njsr  %t\njmp  p8_overlay_out
# (what the thunks from the main program call first, written once for each bank; they end
# in p8_overlay_out or p8_overlay_out_p of overlay_bank.asm.  A thunk is nine bytes so.)
overlay_in = sta  p8_overlay_a\nlda  cartbank.p8s_cartbank_value\nsta  p8_overlay_outside\nlda  #%n\njsr  cartbank\nlda  p8_overlay_a\nrts
overlay_in_full = php\nsta  p8_overlay_a\npla\nsta  p8_overlay_p\nlda  cartbank.p8s_cartbank_value\nsta  p8_overlay_outside\nlda  #%n\njsr  cartbank\nlda  p8_overlay_p\npha\nlda  p8_overlay_a\nplp\nrts
overlay_thunk_cross = php\nsta  p8_overlay_a\npla\nsta  p8_overlay_p\nlda  cartbank.p8s_cartbank_value\npha\nlda  #%n\njsr  cartbank\nlda  p8_overlay_p\npha\nlda  p8_overlay_a\nplp\njsr  %t\nphp\nsta  p8_overlay_a\npla\nsta  p8_overlay_p\npla\njsr  cartbank\nlda  p8_overlay_p\npha\nlda  p8_overlay_a\nplp\nrts
overlay_thunk_cross_fast = sta  p8_overlay_a\nlda  cartbank.p8s_cartbank_value\npha\nlda  #%n\njsr  cartbank\nlda  p8_overlay_a\njsr  %t\nsta  p8_overlay_a\npla\njsr  cartbank\nlda  p8_overlay_a\nrts
overlay_return = jsr  p8_overlay_leave_p\njsr  %t\njmp  p8_overlay_backp_%n
overlay_return_fast = jsr  p8_overlay_leave\njsr  %t\njmp  p8_overlay_back_%n
overlay_back = sta  p8_overlay_a\nlda  cartbank.p8s_cartbank_value\nsta  p8_overlay_outside\nlda  #%n\njsr  cartbank\nlda  p8_overlay_a\nrts
overlay_back_full = php\nsta  p8_overlay_a\npla\nsta  p8_overlay_p\nlda  cartbank.p8s_cartbank_value\nsta  p8_overlay_outside\nlda  #%n\njsr  cartbank\nlda  p8_overlay_p\npha\nlda  p8_overlay_a\nplp\nrts
overlay_support = overlay_bank.asm
overlay_image_first = 128

# The program file is the image of a 2 MB flash cartridge, with the program at its end
# (in the fixed bank), whether the program has overlays or not.  p8c -noimage writes the
# program alone (a .bin of at most 16 KB, which the emulator also takes).
image_size = $200000
image_ext = .gtr
