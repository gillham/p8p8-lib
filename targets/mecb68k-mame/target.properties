# Configuration file for the MECB 68008 CPU Card
#
# MECB creator's documentation:
# https://digicoolthings.com/minimalist-europe-card-bus-mecb/
#
#
cpu = M68000
output_type = ELF
launcher = none
encoding = iso
pointer_size = 4
load_address = 0x9000
memtop = 0x020000
bss_highram_start = $0000
bss_highram_end = $0000
bss_goldenram_start = $0000
bss_goldenram_end = $0000
supports_banked_calls = true

# io_regions specifies memory-mapped I/O registers that should be treated differently.
# it can be zero or more memory address ranges (inclusive) separated by comma
io_regions = $300000-$400000

# replace stock startup code
custom_launcher_code = .include "not_working_startup.asm"

# Where can we find the standard library (syslib.p8).
# You can still add more paths manually using -srcdirs

# additional options passed to the assembler program
assembler_options = -DONT_WORK
