# Target configuration for p8p8: the Tandy Color Computer 3, for a program that has
# memory of its own where BASIC is.
#
# It is the coco3 target (base) with this.  The machine's memory is blocks of 8 KB,
# and BASIC, which runs from RAM on this machine, has blocks $3c to $3f at
# $8000-$ffff.  Here blocks $30 to $33 are put there at the start (rom_out), and
# $8000-$fdff is the program's as plain memory, 32 KB less 512 bytes, beside what
# is left below: some of its variables first (see upper_variables below), and from
# sys.upperstart() on what the program does with it.  (The page at $fe00, where the interrupts come in, stays BASIC's
# whatever block is there; the machine's own addresses follow it.)  A call of a
# routine of BASIC's (the keys, the floats, Disk BASIC's sector routine, WIDTH) goes
# through a few instructions that put BASIC's blocks back around it (the code
# generator writes them: rom_out, rom_in).  The program itself, its variables and
# its stack stay below $8000 (the stack is BASIC's), where LOADM puts the program
# and where BASIC's routines find what they work on.  Only a program that is too
# long for that has some of its code above (see high_code_end below).
#
# Blocks $30 to $33 are BASIC's high resolution graphics screen (HSCREEN): what was
# drawn there is gone.  Every Color Computer 3 has them.

base = ../coco3/target.properties

# BASIC's blocks out and in (A is kept: a routine takes and gives values in it).
# From this address on a call is one of a routine of BASIC's.
rom_out = pshs  a\n\
    lda  #$30\n\
    sta  $ffa4\n\
    lda  #$31\n\
    sta  $ffa5\n\
    lda  #$32\n\
    sta  $ffa6\n\
    lda  #$33\n\
    sta  $ffa7\n\
    puls  a
rom_in = pshs  a\n\
    lda  #$3c\n\
    sta  $ffa4\n\
    lda  #$3d\n\
    sta  $ffa5\n\
    lda  #$3e\n\
    sta  $ffa6\n\
    lda  #$3f\n\
    sta  $ffa7\n\
    puls  a
rom_start = $8000

# Variables in that memory, so that the program has more room below: the code
# generator puts the variables without values there (and its own places for values)
# that BASIC never has to see, from $8000 on and at most to $9fff (the next blocks
# are what the highram module changes for a moment).  A float stays below, and the
# variables of these modules, which give BASIC's routines their addresses or change
# the blocks themselves.  sys.upperstart() is the first address after them: the
# memory from there to $fdff is the program's to use.
upper_variables = $8000
upper_variables_end = $a000
lower_blocks = diskio, floats, highram, txt, sys, conv

# Code in that memory too, when the program is too long for the memory below: the
# code generator then puts some of the program's blocks (not those of lower_blocks)
# after the variables there, up to high_code_end.  LOADM cannot load that part
# (BASIC is in those blocks while it runs), so it is at the end of the program's
# file, after the record that ends what LOADM reads, as chunks of a length, an
# address and bytes (p8c writes the file so).  The program's first instructions
# (high_loader) read it from there with Disk BASIC's sector routine (DSKCON): the
# file is the one whose name Disk BASIC used last, on the drive it used last, so the
# program is started right after it was loaded (LOADM"NAME":EXEC).  They find the
# file in the directory, follow its granules past the records that LOADM read, and
# put each byte in its block through $4000 for a moment.  An error of the drive, or
# a file that is not there, ends in BASIC's "IO ERROR".  A second EXEC does not
# load again.
high_code_end = $fe00
high_loader = tst  p8l_done\n\
    bne  p8l_end\n\
    lda  #17\n\
    sta  $ec\n\
    lda  #2\n\
    sta  $ed\n\
    ldx  #$0700\n\
    bsr  p8l_read\n\
    lda  #3\n\
    p8l_dirsec:\n\
    sta  $ed\n\
    ldx  #$0600\n\
    bsr  p8l_read\n\
    p8l_entry:\n\
    lda  ,x\n\
    beq  p8l_other\n\
    cmpa  #$ff\n\
    beq  p8l_fail\n\
    ldy  #$094c\n\
    ldb  #11\n\
    pshs  x\n\
    p8l_same:\n\
    lda  ,x+\n\
    cmpa  ,y+\n\
    bne  p8l_differs\n\
    decb\n\
    bne  p8l_same\n\
    puls  x\n\
    lda  13,x\n\
    sta  p8l_gran\n\
    clr  p8l_sec\n\
    clr  p8l_pos\n\
    clr  p8l_valid\n\
    bra  p8l_record\n\
    p8l_differs:\n\
    puls  x\n\
    p8l_other:\n\
    leax  32,x\n\
    cmpx  #$0700\n\
    blo  p8l_entry\n\
    lda  $ed\n\
    inca\n\
    cmpa  #12\n\
    blo  p8l_dirsec\n\
    p8l_fail:\n\
    ldb  #40\n\
    jmp  $ac46\n\
    p8l_record:\n\
    bsr  p8l_get\n\
    pshs  a\n\
    bsr  p8l_get\n\
    sta  p8l_len\n\
    bsr  p8l_get\n\
    sta  p8l_len+1\n\
    bsr  p8l_get\n\
    bsr  p8l_get\n\
    puls  a\n\
    tsta\n\
    bne  p8l_chunk\n\
    ldd  p8l_len\n\
    bsr  p8l_skip\n\
    bra  p8l_record\n\
    p8l_chunk:\n\
    bsr  p8l_get\n\
    sta  p8l_len\n\
    bsr  p8l_get\n\
    sta  p8l_len+1\n\
    bsr  p8l_get\n\
    sta  p8l_to\n\
    bsr  p8l_get\n\
    sta  p8l_to+1\n\
    ldd  p8l_len\n\
    beq  p8l_loaded\n\
    ldx  p8l_to\n\
    p8l_byte:\n\
    bsr  p8l_get\n\
    pshs  a\n\
    tfr  x,d\n\
    pshs  d\n\
    lsra\n\
    lsra\n\
    lsra\n\
    lsra\n\
    lsra\n\
    adda  #$2c\n\
    ldb  ,s\n\
    andb  #$1f\n\
    orb  #$40\n\
    stb  ,s\n\
    puls  u\n\
    pshs  cc\n\
    orcc  #$50\n\
    sta  $ffa2\n\
    lda  1,s\n\
    sta  ,u\n\
    lda  #$3a\n\
    sta  $ffa2\n\
    puls  cc,a\n\
    leax  1,x\n\
    ldd  p8l_len\n\
    subd  #1\n\
    std  p8l_len\n\
    bne  p8l_byte\n\
    bra  p8l_chunk\n\
    p8l_loaded:\n\
    inc  p8l_done\n\
    bra  p8l_end\n\
    p8l_get:\n\
    pshs  x,b\n\
    tst  p8l_valid\n\
    bne  p8l_have\n\
    lda  p8l_gran\n\
    cmpa  #68\n\
    bhs  p8l_fail\n\
    ldb  p8l_sec\n\
    incb\n\
    lsra\n\
    bcc  p8l_first\n\
    addb  #9\n\
    p8l_first:\n\
    cmpa  #17\n\
    blo  p8l_track\n\
    inca\n\
    p8l_track:\n\
    sta  $ec\n\
    stb  $ed\n\
    ldx  #$0600\n\
    bsr  p8l_read\n\
    inc  p8l_valid\n\
    p8l_have:\n\
    ldx  #$0600\n\
    ldb  p8l_pos\n\
    abx\n\
    lda  ,x\n\
    pshs  a\n\
    ldd  #1\n\
    bsr  p8l_skip\n\
    puls  a,b,x,pc\n\
    p8l_skip:\n\
    addb  p8l_pos\n\
    adca  #0\n\
    stb  p8l_pos\n\
    tsta\n\
    beq  p8l_skipped\n\
    clr  p8l_valid\n\
    p8l_sector:\n\
    inc  p8l_sec\n\
    ldb  p8l_sec\n\
    cmpb  #9\n\
    blo  p8l_within\n\
    clr  p8l_sec\n\
    ldb  p8l_gran\n\
    cmpb  #68\n\
    bhs  p8l_within\n\
    ldx  #$0700\n\
    abx\n\
    ldb  ,x\n\
    stb  p8l_gran\n\
    p8l_within:\n\
    deca\n\
    bne  p8l_sector\n\
    p8l_skipped:\n\
    rts\n\
    p8l_read:\n\
    stx  $ee\n\
    lda  #2\n\
    sta  $ea\n\
    ldu  $c004\n\
    jsr  ,u\n\
    tst  $f0\n\
    bne  p8l_fail\n\
    rts\n\
    p8l_done:\n\
    fcb  0\n\
    p8l_gran:\n\
    fcb  0\n\
    p8l_sec:\n\
    fcb  0\n\
    p8l_pos:\n\
    fcb  0\n\
    p8l_valid:\n\
    fcb  0\n\
    p8l_len:\n\
    fdb  0\n\
    p8l_to:\n\
    fdb  0\n\
    p8l_end:

# The first instructions: the interrupts come to the program's own routine below,
# in place of BASIC's, through BASIC's jump at $010c.
startup_code = pshs  cc\n\
    orcc  #$50\n\
    ldx  $010d\n\
    stx  p8_irq_old\n\
    ldx  #p8_irq\n\
    stx  $010d\n\
    puls  cc

# The block that the program has at $e000, which comes back there after the screen's
# (the textio module and the console put the screen's block there for a moment).
# And the interrupt routine: BASIC's is in its own blocks (the clock, the disk
# drive's motor, the sound), so they are put back for it.  When they are there
# already (the interrupt came during a call of a routine of BASIC's: p8_rom_on) it
# is BASIC's as it is.  Else BASIC's routine is given a made-up interrupt frame to
# return through: the address below, nine bytes of registers that do not matter,
# and the flags that say it is a whole frame; there the program's blocks come back
# and the real frame ends the interrupt.
machine_cells = p8_top_block:\n\
    fcb  $33\n\
    p8_irq:\n\
    tst  p8_rom_on\n\
    bne  p8_irq_rom\n\
    lda  #$3c\n\
    sta  $ffa4\n\
    lda  #$3d\n\
    sta  $ffa5\n\
    lda  #$3e\n\
    sta  $ffa6\n\
    lda  #$3f\n\
    sta  $ffa7\n\
    ldx  #p8_irq_back\n\
    pshs  x\n\
    leas  -9,s\n\
    lda  #$d0\n\
    pshs  a\n\
    p8_irq_rom:\n\
    jmp  [p8_irq_old]\n\
    p8_irq_back:\n\
    lda  #$30\n\
    sta  $ffa4\n\
    lda  #$31\n\
    sta  $ffa5\n\
    lda  #$32\n\
    sta  $ffa6\n\
    lda  #$33\n\
    sta  $ffa7\n\
    rti\n\
    p8_irq_old:\n\
    fdb  0

# The end: BASIC's interrupt routine back in its place (interrupts off until its
# blocks are there again, which the code generator does after these lines), and
# back to BASIC with interrupts on.
exit_hook = orcc  #$50\n\
    ldx  p8_irq_old\n\
    stx  $010d
exit_code = andcc  #$af\n\
    rts

run_command = xroar -machine coco3 -run {file}
library = ../m6809
