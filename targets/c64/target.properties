# Target configuration for p8p8: the Commodore 64.
#
# The format is that of the upstream compiler's custom targets (a Java properties
# file: key = value, # comments, \n for a new line inside a value), with a few
# keys of p8p8's own, marked "(p8p8)".  docs/TARGETS.md describes them all.
# The values are those of the upstream compiler's built-in c64 target.

cpu = 6502
encoding = petscii
output_type = PRG
launcher = BASIC
load_address = $0801
memtop = $cfe0
supports_banked_calls = true

# memory for the variables without an initial value, for -varshigh and -varsgolden (0: none)
bss_highram_start = $c000
bss_highram_end = $cfdf
bss_goldenram_start = 0
bss_goldenram_end = 0

# zero page scratch cells of the library's assembly code; zp_scratch_reg is zp_scratch_b1+1
zp_scratch_b1 = $02
zp_scratch_reg = $03
zp_scratch_w1 = $fb
zp_scratch_w2 = $fd
zp_scratch_ptr = $04

# the free zero page locations for each %zeropage mode
zp_fullsafe = $02-$90,$92-$9f,$a3-$bf,$c1-$c4,$c6-$ca,$cc-$f4,$f7-$ff
zp_kernalsafe = $02-$25,$39-$48,$4b-$4f,$51-$53,$57-$8f,$92,$96,$9c,$9e-$9f,$a6,$b0-$b1,$be-$bf,$f9,$ff
zp_basicsafe = $02-$06,$0a,$0e,$92,$96,$9c,$9e-$9f,$a6,$b0-$b1,$be-$bf,$f9
# (p8p8) for %zeropage floatsafe; without it the basicsafe list is used
zp_floatsafe = $02-$0f,$13-$21,$39-$48,$4b-$4f,$51-$53,$73-$8a,$92,$96,$9c,$9e-$9f,$a6,$b0-$b1,$be-$bf,$f9

# where the library has the 16 virtual registers R0-R15
virtual_registers = $cfe0

# (p8p8) symbols for the assembler; the _floats one replaces it in a program that uses floats
asm_symbols = PROG8_C64_BANK_CONFIG=30  ; IO+kernal, no basic
asm_symbols_floats = PROG8_C64_BANK_CONFIG=31  ; basic+IO+kernal
