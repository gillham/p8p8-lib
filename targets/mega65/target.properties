# configuration file for a Prog8 Mega65 target

# (p8p8) The MEGA65's own CPU: longs with its 32-bit instructions, multiplication and
# division with the machine's arithmetic unit.  p8c -cpu 6502 writes plain 6502 code.
# The reference compilers know no 45GS02: a copy of this file for them says 6502.
cpu = 45gs02
encoding = petscii
output_type = PRG
load_address = $2001
memtop = $c000
bss_highram_start = 0
bss_highram_end = 0
; temp chunk to make romable code easier
bss_goldenram_start = $7000
bss_goldenram_end = $8000

# io_regions specifies memory-mapped I/O registers that should be treated differentely.
# it can be zero or more memory address ranges (inclusive) separated by comma
io_regions = 0,1,$d000-$dfff

# zeropage scratch variables. zp_scratch_reg must always be zp_scratch_b1+1 !
zp_scratch_b1 = $72
zp_scratch_reg = $73
zp_scratch_ptr = $74
zp_scratch_w1 = $fb
zp_scratch_w2 = $fd

# free zeropage locations for the various zp usage methods
# zero or more zeropage address ranges (inclusive).
zp_fullsafe = $02-$90,$92-$9f,$a3-$ba,$c1,$c2,$c3,$c4,$c6-$ca,$cf-$f4,$f7-$ff
zp_kernalsafe = $02-$25,$39-$48,$4b-$4f,$51-$53,$57-$8f,$9b,$9c,$a6,$b1,$bf,$f9,$ff
zp_basicsafe = $02-$06,$0a,$0e,$9b,$9c,$a6,$b1,$bf,$f9

# the start of the 32 bytes used by the R0-R15 virtual registers. Can be in Zeropage or elsewhere.
virtual_registers = $1fe0

# Where can we find the standard library (syslib.p8). You can still add more paths manually using -srcdirs

# if a non-empty custom launcher code string is supplied, the compiler won't output ANY launcher / init code by itself,
# and instead outputs whatever is specified here. (You can use \n here for newline and \ for line continuantions)
custom_launcher_code = .word (+), 2025\n.byte $fe,$02,$30\n.byte $3a,$9e\n.null format(' %d  ', prog8_entrypoint)\n.byte 0\n+ .byte 0,0\nprog8_entrypoint\ncld\ntsx\nstx prog8_lib.orig_stackpointer\njsr  p8_sys_startup.init_system\njsr  p8_sys_startup.init_system_phase2\nprog8_exit_noreset :?= 0\n.if prog8_zeropage_safe == 0 && prog8_exit_noreset == 0\nlda  #>sys.reset_system\npha\nlda  #<sys.reset_system\npha\n.endif\njsr  p8b_main.p8s_start\njmp  p8_sys_startup.cleanup_at_exit

# additional options passed to the assembler program
assembler_options =

# (p8p8) data at addresses of more than 16 bits: the MEGA65's 28-bit address space: bank 4 and 5, the attic RAM at $8000000, the colour RAM.
# &ubyte NAME = $address, @($address), peek and poke take such an address when the
# program is compiled for the CPU that reaches it.
far_address_bits = 28

# Overlays (p8p8): blocks with %overlay n have their code in memory beyond 64 KB (from
# overlay_store on) and run in this window of main memory, one at a time, brought in by
# the DMA controller (the program itself then ends below the window).
overlay_window_start = $a000
overlay_window_end = $c000
overlay_thunk = jsr  p8_overlay.call\n.byte  %n\n.word  %t
# (for an ordinary subroutine: A, X and Y are kept, and the overlay is only looked for
# when it is not the one in the window)
overlay_thunk_fast = sta  p8_overlay.save_a\nlda  p8_overlay.current\npha\nlda  #%n\ncmp  p8_overlay.current\nbeq  +\njsr  p8_overlay.bring_keeping\n+ lda  p8_overlay.save_a\njsr  %t\nsta  p8_overlay.save_a\npla\nbeq  +\ncmp  p8_overlay.current\nbeq  +\njsr  p8_overlay.bring_keeping\n+ lda  p8_overlay.save_a\nrts
overlay_select = $0000
overlay_store = $40000
overlay_support = overlay_dma.asm
overlay_max = 16
