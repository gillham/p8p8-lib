# Target configuration for p8p8: the Commodore 128.
#
# The format is that of the upstream compiler's custom targets (a Java properties
# file: key = value, # comments, \n for a new line inside a value), with a few
# keys of p8p8's own, marked "(p8p8)".  docs/TARGETS.md describes them all.
# The values are those of the upstream compiler's built-in c128 target.

cpu = 6502
encoding = petscii
output_type = PRG
launcher = BASIC
load_address = $1c01
memtop = $c000
supports_banked_calls = true

# memory for the variables without an initial value, for -varshigh and -varsgolden (0: none)
bss_highram_start = 0
bss_highram_end = 0
bss_goldenram_start = $1300
bss_goldenram_end = $1bdf

# zero page scratch cells of the library's assembly code; zp_scratch_reg is zp_scratch_b1+1
zp_scratch_b1 = $74
zp_scratch_reg = $75
zp_scratch_w1 = $fb
zp_scratch_w2 = $fd
zp_scratch_ptr = $0b

# the free zero page locations for each %zeropage mode
zp_fullsafe = $0a-$8f,$92-$9f,$a3-$bf,$c1-$cb,$ce-$cf,$d6-$f6,$f8-$ff
zp_kernalsafe = $0a-$8f,$96,$9b-$9c,$9e-$9f,$a7-$ab,$b0-$b1,$b4-$b6
zp_basicsafe = $0b-$12,$14,$16-$17,$1b-$23,$28-$2c,$3f-$44,$47-$4c,$4f-$68,$6a-$6f,$71,$74-$75,$78,$80,$83,$87-$8f,$96,$9b-$9c,$9e-$9f,$a7-$ab,$b0-$b1,$b4-$b6
# (p8p8) for %zeropage floatsafe; without it the basicsafe list is used
zp_floatsafe = $0b-$12,$14,$16-$17,$1b-$23,$28-$2c,$3f-$44,$47-$4c,$4f-$68,$6a-$6f,$71,$74-$75,$78,$80,$83,$87-$8f,$96,$9b-$9c,$9e-$9f,$a7-$ab,$b0-$b1,$b4-$b6

# where the library has the 16 virtual registers R0-R15
virtual_registers = $1be0

# (p8p8) the first instructions of the program: the BASIC ROM banked out, before anything above $3fff is used
startup_code = lda  #$0e\nsta  $ff00

# (p8p8) follows the startup code.  cleanup_at_exit jumps to prog8_c128_exit: bank 15 has to be
# selected from code below $4000.  prog8_c128_reset resets the machine when the zero page was used.
exit_code = prog8_c128_exit:\n.if prog8_program_start < $4000\n    pha\n    lda  #0\n    sta  $ff00\n    pla\n.endif\n    rts\nprog8_c128_reset:\n    sei\n    jmp  (cbm.RESET_VEC)

# (p8p8) what is pushed as the return address of the program when the zero page is not kept
# (default: sys.reset_system)
reset_address = prog8_c128_reset-1
