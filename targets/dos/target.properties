# Target configuration for p8p8: MS-DOS on an 8086 or 8088 (an IBM PC or a compatible),
# as a .COM program.
#
# An 8086 machine: "cpu = 8086" selects p8p8's own 8086 code generator, which writes
# assembly for nasm.  A .COM file is the program as it is in memory: DOS loads it at
# $0100 of a segment of 64 KB that code, data and stack share, with the stack at the
# segment's end.  docs/TARGETS.md describes the keys.

cpu = 8086
encoding = cp437
load_address = $0100
output_extension = .com
# (no BASIC line before the program)
launcher = none
# where the program and its variables must have ended: the assembler stops when they
# have not (the stack comes down from the end of the segment; this leaves it 4 KB)
memory_end = $f000

# how the program ends: DOS's "terminate with return code", the status in AL
exit_code = mov  ah, 0x4c\n\
    int  0x21

# what -run runs, with {file} for the program
run_command = dosbox-x -fastlaunch {file}

# The first instructions find out where the program's text goes and comes from (DOS's
# IOCTL, function $4400, on the handles 1 and 0): to the screen and from the keyboard,
# or to and from a file or another device, when they are redirected.
startup_code = mov  ax, 0x4400\n\
    mov  bx, 1\n\
    int  0x21\n\
    and  dl, 0x82\n\
    cmp  dl, 0x82\n\
    jne  p8dos_file_out\n\
    inc  byte [p8dos_screen]\n\
    p8dos_file_out:\n\
    mov  ax, 0x4400\n\
    xor  bx, bx\n\
    int  0x21\n\
    and  dl, 0x81\n\
    cmp  dl, 0x81\n\
    jne  p8dos_file_in\n\
    inc  byte [p8dos_keyboard]\n\
    p8dos_file_in:

# what the routines below and textio share: whether the output is the screen and
# the input the keyboard, and the colours of the text (the BIOS's attribute byte)
machine_cells = p8dos_screen:  db  0\n\
    p8dos_keyboard:  db  0\n\
    p8dos_attr:  db  7

# The console, as three routines that end by returning: a character (in AL) out, a
# key or 0 without waiting (in AL), and a character in that is waited for.
#
# A character goes to the screen through the BIOS, in the colours of p8dos_attr:
# written with its attribute where the cursor is (function 9), and once more as a
# teletype would (function $0e), which moves the cursor and scrolls.  When the
# output is redirected it goes through DOS.  A line ends with 10 in Prog8 and with
# 13, 10 for DOS and the BIOS.
console_out = cmp  byte [p8dos_screen], 0\n\
    jne  p8dos_bios_out\n\
    cmp  al, 10\n\
    jne  p8dos_out\n\
    mov  dl, 13\n\
    mov  ah, 2\n\
    int  0x21\n\
    mov  al, 10\n\
    p8dos_out:\n\
    mov  dl, al\n\
    mov  ah, 2\n\
    int  0x21\n\
    ret\n\
    p8dos_bios_out:\n\
    cmp  al, 10\n\
    jne  p8dos_bios_other\n\
    mov  al, 13\n\
    call  p8dos_teletype\n\
    mov  al, 10\n\
    jmp  p8dos_teletype\n\
    p8dos_bios_other:\n\
    cmp  al, 13\n\
    je  p8dos_teletype\n\
    cmp  al, 8\n\
    je  p8dos_teletype\n\
    cmp  al, 7\n\
    je  p8dos_teletype\n\
    push  ax\n\
    mov  ah, 9\n\
    xor  bh, bh\n\
    mov  bl, [p8dos_attr]\n\
    mov  cx, 1\n\
    int  0x10\n\
    pop  ax\n\
    p8dos_teletype:\n\
    mov  ah, 0x0e\n\
    xor  bh, bh\n\
    int  0x10\n\
    ret

# A key comes from the BIOS, so that the keys without a character are told apart:
# such a key is 128 plus its scan code (the up arrow is 200).  Redirected input
# comes through DOS; its end (26, or nothing more) is 0.
key_poll = cmp  byte [p8dos_keyboard], 0\n\
    jne  p8dos_bios_key\n\
    mov  ah, 6\n\
    mov  dl, 255\n\
    int  0x21\n\
    jnz  p8dos_key\n\
    xor  al, al\n\
    p8dos_key:\n\
    ret\n\
    p8dos_bios_key:\n\
    mov  ah, 1\n\
    int  0x16\n\
    jnz  p8dos_bios_read\n\
    xor  al, al\n\
    ret\n\
    p8dos_bios_read:\n\
    xor  ah, ah\n\
    int  0x16\n\
    test  al, al\n\
    jnz  p8dos_bios_end\n\
    mov  al, ah\n\
    or  al, 128\n\
    p8dos_bios_end:\n\
    ret
char_in = cmp  byte [p8dos_keyboard], 0\n\
    jne  p8dos_bios_in\n\
    mov  ah, 8\n\
    int  0x21\n\
    cmp  al, 26\n\
    jne  p8dos_in\n\
    xor  al, al\n\
    p8dos_in:\n\
    cmp  al, 13\n\
    jne  p8dos_in_end\n\
    mov  al, 10\n\
    p8dos_in_end:\n\
    ret\n\
    p8dos_bios_in:\n\
    call  p8dos_bios_read\n\
    jmp  p8dos_in

# The command line: the text after the program's name is at $81 of the program's
# segment, its length at $80.  Its blanks become zeros once, and an argument is
# where it stands there.  Argument 0 is the program's own name, which DOS 3.0 and
# later have after the environment's strings.
arguments = p8dos_split:\n\
    cmp  byte [p8dos_split_done], 0\n\
    jne  p8dos_split_end\n\
    inc  byte [p8dos_split_done]\n\
    mov  cl, [0x80]\n\
    xor  ch, ch\n\
    mov  si, 0x81\n\
    mov  bx, cx\n\
    mov  byte [bx+si], 0\n\
    jcxz  p8dos_split_end\n\
    p8dos_split_next:\n\
    cmp  byte [si], 32\n\
    ja  p8dos_split_keep\n\
    mov  byte [si], 0\n\
    p8dos_split_keep:\n\
    inc  si\n\
    loop  p8dos_split_next\n\
    p8dos_split_end:\n\
    ret\n\
    p8dos_word:\n\
    call  p8dos_split\n\
    mov  si, 0x81\n\
    mov  cl, [0x80]\n\
    xor  ch, ch\n\
    xor  ax, ax\n\
    xor  bl, bl\n\
    jcxz  p8dos_word_none\n\
    p8dos_word_next:\n\
    cmp  byte [si], 0\n\
    je  p8dos_word_gap\n\
    test  bl, bl\n\
    jnz  p8dos_word_in\n\
    mov  bl, 1\n\
    inc  ax\n\
    cmp  ax, dx\n\
    je  p8dos_word_found\n\
    jmp  p8dos_word_in\n\
    p8dos_word_gap:\n\
    xor  bl, bl\n\
    p8dos_word_in:\n\
    inc  si\n\
    loop  p8dos_word_next\n\
    p8dos_word_none:\n\
    stc\n\
    ret\n\
    p8dos_word_found:\n\
    clc\n\
    ret\n\
    p8rt_argc:\n\
    xor  dx, dx\n\
    call  p8dos_word\n\
    inc  ax\n\
    ret\n\
    p8rt_argv:\n\
    mov  dx, ax\n\
    test  dx, dx\n\
    jz  p8dos_name\n\
    call  p8dos_word\n\
    mov  ax, si\n\
    jnc  p8dos_argv_end\n\
    mov  ax, p8dos_empty\n\
    p8dos_argv_end:\n\
    ret\n\
    p8dos_name:\n\
    push  es\n\
    mov  es, [0x2c]\n\
    xor  di, di\n\
    xor  al, al\n\
    mov  cx, 0x7fff\n\
    p8dos_name_env:\n\
    repne scasb\n\
    scasb\n\
    jne  p8dos_name_env\n\
    add  di, 2\n\
    mov  si, p8dos_path\n\
    p8dos_name_copy:\n\
    mov  al, [es:di]\n\
    mov  [si], al\n\
    inc  di\n\
    inc  si\n\
    test  al, al\n\
    jz  p8dos_name_end\n\
    cmp  si, p8dos_path+79\n\
    jb  p8dos_name_copy\n\
    p8dos_name_end:\n\
    pop  es\n\
    mov  ax, p8dos_path\n\
    ret\n\
    p8dos_split_done:  db  0\n\
    p8dos_path:  times  80  db  0\n\
    p8dos_empty:  db  0

# one 60th of a second: until the screen's next vertical retrace begins (bit 3 of
# the CGA's, EGA's and VGA's status port; each wait gives up after 65536 looks, so a
# machine without the port goes on)
wait_jiffy = mov  dx, 0x3da\n\
    xor  cx, cx\n\
    p8dos_retrace:\n\
    in  al, dx\n\
    test  al, 8\n\
    loopnz  p8dos_retrace\n\
    xor  cx, cx\n\
    p8dos_display:\n\
    in  al, dx\n\
    test  al, 8\n\
    loopz  p8dos_display\n\
    ret

# the clock in 60ths of a second: the BIOS's count of timer ticks (18.2 a second)
# times 33 / 10.  Only its low 16 bits count, so the value jumps once an hour.
ticks = xor  ah, ah\n\
    int  0x1a\n\
    mov  ax, dx\n\
    mov  bx, 33\n\
    mul  bx\n\
    mov  cx, ax\n\
    mov  ax, dx\n\
    xor  dx, dx\n\
    mov  bx, 10\n\
    div  bx\n\
    mov  ax, cx\n\
    div  bx\n\
    ret

# The modules: those of this directory first (textio), then those that the 8086
# machines share.
library = ../i8086
