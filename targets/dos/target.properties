# Target configuration for p8p8: MS-DOS on an 8086 or 8088 (an IBM PC or a compatible),
# as a .COM program.
#
# An 8086 machine: "cpu = 8086" selects p8p8's own 8086 code generator, which writes
# assembly for nasm.  A .COM file is the program as it is in memory: DOS loads it at
# $0100 of a segment of 64 KB that code, data and stack share, with the stack at the
# segment's end.  docs/TARGETS.md describes the keys.

cpu = 8086
encoding = cp437
load_address = $0100
output_extension = .com
# (no BASIC line before the program)
launcher = none
# where the program and its variables must have ended: the assembler stops when they
# have not (the stack comes down from the end of the segment; this leaves it 4 KB)
memory_end = $f000

# how the program ends: DOS's "terminate with return code", the status in AL
exit_code = mov  ah, 0x4c\n\
    int  0x21

# what -run runs, with {file} for the program
run_command = dosbox-x -fastlaunch {file}

# The console, as three routines that end by returning: a character (in AL) out, a
# key or 0 without waiting (in AL), and a character in that is waited for.  They are
# DOS's own, so that what a program prints and reads can be redirected.  A line
# ends with 10 in Prog8 and with 13, 10 in DOS; Enter is 13, and comes as 10.
console_out = cmp  al, 10\n\
    jne  p8dos_out\n\
    mov  dl, 13\n\
    mov  ah, 2\n\
    int  0x21\n\
    mov  al, 10\n\
    p8dos_out:\n\
    mov  dl, al\n\
    mov  ah, 2\n\
    int  0x21\n\
    ret
key_poll = mov  ah, 6\n\
    mov  dl, 255\n\
    int  0x21\n\
    jnz  p8dos_key\n\
    xor  al, al\n\
    p8dos_key:\n\
    ret
char_in = mov  ah, 8\n\
    int  0x21\n\
    cmp  al, 13\n\
    jne  p8dos_in\n\
    mov  al, 10\n\
    p8dos_in:\n\
    ret

# one 60th of a second: until the screen's next vertical retrace begins (bit 3 of
# the CGA's, EGA's and VGA's status port; each wait gives up after 65536 looks, so a
# machine without the port goes on)
wait_jiffy = mov  dx, 0x3da\n\
    xor  cx, cx\n\
    p8dos_retrace:\n\
    in  al, dx\n\
    test  al, 8\n\
    loopnz  p8dos_retrace\n\
    xor  cx, cx\n\
    p8dos_display:\n\
    in  al, dx\n\
    test  al, 8\n\
    loopz  p8dos_display\n\
    ret

# the clock in 60ths of a second: the BIOS's count of timer ticks (18.2 a second)
# times 33 / 10.  Only its low 16 bits count, so the value jumps once an hour.
ticks = xor  ah, ah\n\
    int  0x1a\n\
    mov  ax, dx\n\
    mov  bx, 33\n\
    mul  bx\n\
    mov  cx, ax\n\
    mov  ax, dx\n\
    xor  dx, dx\n\
    mov  bx, 10\n\
    div  bx\n\
    mov  ax, cx\n\
    div  bx\n\
    ret

# The modules: those of this directory first (textio), then those that the 8086
# machines share.
library = ../i8086
