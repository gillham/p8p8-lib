# Target configuration for p8p8: the Commander X16.
#
# The format is that of the upstream compiler's custom targets (a Java properties
# file: key = value, # comments, \n for a new line inside a value), with a few
# keys of p8p8's own, marked "(p8p8)".  docs/TARGETS.md describes them all.
# The values are those of the upstream compiler's built-in cx16 target.

cpu = 65c02
encoding = petscii
output_type = PRG
launcher = BASIC
load_address = $0801
memtop = $9f00
supports_banked_calls = true

# memory for the variables without an initial value, for -varshigh and -varsgolden (0: none)
bss_highram_start = $a000
bss_highram_end = $bfff
bss_goldenram_start = $0400
bss_goldenram_end = $07ff

# zero page scratch cells of the library's assembly code; zp_scratch_reg is zp_scratch_b1+1
zp_scratch_b1 = $7a
zp_scratch_reg = $7b
zp_scratch_w1 = $7c
zp_scratch_w2 = $7e
zp_scratch_ptr = $22

# the free zero page locations for each %zeropage mode
zp_fullsafe = $22-$ff
zp_kernalsafe = $22-$7f,$a9-$ff
zp_basicsafe = $22-$7f
# (p8p8) for %zeropage floatsafe; without it the basicsafe list is used
zp_floatsafe = $22-$7f,$d4-$ff

# where the library has the 16 virtual registers R0-R15
virtual_registers = $0002

# (p8p8) the routine that calls into another bank (the bank and address follow the jsr)
jsrfar_routine = cx16.JSRFAR

# (p8p8) run before main.start when the program uses floats: the BASIC ROM bank, where the float routines are
startup_code_floats = lda  #4\nsta  $01
