# Target configuration for p8p8: the Commander X16.
#
# The format is that of the upstream compiler's custom targets (a Java properties
# file: key = value, # comments, \n for a new line inside a value), with a few
# keys of p8p8's own, marked "(p8p8)".  docs/TARGETS.md describes them all.
# The values are those of the upstream compiler's built-in cx16 target.

cpu = 65c02
# with -cpu 65816: the ROM runs programs that stay in the 65816's native mode (p8p8)
native65816 = rest
encoding = petscii
output_type = PRG
launcher = BASIC
load_address = $0801
memtop = $9f00
supports_banked_calls = true

# memory for the variables without an initial value, for -varshigh and -varsgolden (0: none)
bss_highram_start = $a000
bss_highram_end = $bfff
bss_goldenram_start = $0400
bss_goldenram_end = $07ff

# zero page scratch cells of the library's assembly code; zp_scratch_reg is zp_scratch_b1+1
zp_scratch_b1 = $7a
zp_scratch_reg = $7b
zp_scratch_w1 = $7c
zp_scratch_w2 = $7e
zp_scratch_ptr = $22

# the free zero page locations for each %zeropage mode
zp_fullsafe = $22-$ff
zp_kernalsafe = $22-$7f,$a9-$ff
zp_basicsafe = $22-$7f
# (p8p8) for %zeropage floatsafe; without it the basicsafe list is used
zp_floatsafe = $22-$7f,$d4-$ff

# where the library has the 16 virtual registers R0-R15
virtual_registers = $0002

# (p8p8) the routine that calls into another bank (the bank and address follow the jsr)
jsrfar_routine = cx16.JSRFAR

# (p8p8) run before main.start when the program uses floats: the BASIC ROM bank, where the float routines are
startup_code_floats = lda  #4\nsta  $01

# Overlays (p8p8): blocks with %overlay n have their code in RAM bank n, which is in the
# window while that code runs.  A call from outside goes through a thunk in main memory
# (%t: the subroutine, %n: the overlay) that chooses the bank, calls, and puts back the
# bank that was there.  The first keeps A, X, Y and the flags both ways (a subroutine in
# assembly may take or give anything); the fast one keeps A, X and Y, which is all an
# ordinary subroutine uses.  overlay_support is included in such a program: it has the
# two bytes the thunks use.
overlay_window_start = $a000
overlay_window_end = $c000
overlay_thunk = php\nsta  p8_overlay_a\npla\nsta  p8_overlay_p\nlda  $00\npha\nlda  #%n\nsta  $00\nlda  p8_overlay_p\npha\nlda  p8_overlay_a\nplp\njsr  %t\nphp\nsta  p8_overlay_a\npla\nsta  p8_overlay_p\npla\nsta  $00\nlda  p8_overlay_p\npha\nlda  p8_overlay_a\nplp\nrts
overlay_thunk_fast = sta  p8_overlay_a\nlda  $00\npha\nlda  #%n\nsta  $00\nlda  p8_overlay_a\njsr  %t\nsta  p8_overlay_a\npla\nsta  $00\nlda  p8_overlay_a\nrts
# A call out of an overlay into the main program or the library goes through a stub in
# main memory that calls and then chooses the overlay's bank again (this text), since
# what was called may have left another bank in the window (a program's own data).  The
# first keeps A and the flags; the fast one, after an ordinary subroutine, A.
overlay_return = php\npha\nlda  #%n\nsta  $00\npla\nplp
overlay_return_fast = pha\nlda  #%n\nsta  $00\npla
overlay_select = $0000
overlay_loader = overlay_loader.asm
overlay_support = overlay_bank.asm
