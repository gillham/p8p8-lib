# Target configuration for p8p8: the Tandy Color Computer 1 and 2 with 64 KB, for a
# program that runs with the ROMs switched out.
#
# It is the coco2 target (base) with this: the RAM that a 64 KB machine has under
# its ROMs is switched in at the start, and $8000-$feff is the program's as plain
# memory, 32 KB of it, beside what is left below.  A call of a routine in the ROM
# (the keys, the floats, Disk BASIC's sector routine) goes through a few
# instructions that switch the ROMs in around it (the code generator writes them:
# rom_out, rom_in).  The program itself, its variables and its stack stay below
# $8000 (the stack is BASIC's), where LOADM puts the program and where the ROM's
# routines find what they work on.  Without RAM under the ROMs (16 or 32 KB) the
# program returns to BASIC at once.

base = ../coco2/target.properties

# The ROMs out and in: the machine's address decoder (the SAM) has two addresses for
# it.  From this address on a call is one into the ROM.
rom_out = sta  $ffdf
rom_in = sta  $ffde
rom_start = $8000

# The first instructions: is there RAM under the ROMs?  A byte there is changed and
# read back (and the lower half must not have changed with it); without it, back to
# BASIC.  Then the interrupts come to the program's own routine below, in place of
# BASIC's, through BASIC's jump at $010c.
startup_code = pshs  cc\n\
    orcc  #$50\n\
    sta  $ffdf\n\
    ldb  $8000\n\
    lda  >$0000\n\
    pshs  a\n\
    comb\n\
    stb  $8000\n\
    cmpb  $8000\n\
    bne  p8ram_none\n\
    lda  >$0000\n\
    cmpa  ,s\n\
    bne  p8ram_none\n\
    comb\n\
    stb  $8000\n\
    leas  1,s\n\
    sta  $ffde\n\
    ldx  $010d\n\
    stx  p8_irq_old\n\
    ldx  #p8_irq\n\
    stx  $010d\n\
    puls  cc\n\
    bra  p8ram_go\n\
    p8ram_none:\n\
    comb\n\
    stb  $8000\n\
    leas  1,s\n\
    sta  $ffde\n\
    puls  cc\n\
    rts\n\
    p8ram_go:

# The interrupt routine: BASIC's is in the ROM (the clock, the disk drive's motor,
# the sound), so the ROMs are switched in for it.  When they are in already (the
# interrupt came during a call into the ROM: p8_rom_on) it is BASIC's as it is.
# Else BASIC's routine is given a made-up interrupt frame to return through: the
# address below, nine bytes of registers that do not matter, and the flags that
# say it is a whole frame; there the ROMs go out again and the real frame ends the
# interrupt.
machine_cells = p8_irq:\n\
    tst  p8_rom_on\n\
    bne  p8_irq_rom\n\
    sta  $ffde\n\
    ldx  #p8_irq_back\n\
    pshs  x\n\
    leas  -9,s\n\
    lda  #$d0\n\
    pshs  a\n\
    p8_irq_rom:\n\
    jmp  [p8_irq_old]\n\
    p8_irq_back:\n\
    sta  $ffdf\n\
    rti\n\
    p8_irq_old:\n\
    fdb  0

# The end: BASIC's interrupt routine back in its place (interrupts off until the
# ROMs are in again, which the code generator does after these lines), and back to
# BASIC with interrupts on.
exit_hook = orcc  #$50\n\
    ldx  p8_irq_old\n\
    stx  $010d
exit_code = andcc  #$af\n\
    rts

run_command = xroar -machine coco2bus -ram 64 -run {file}
library = ../m6809
